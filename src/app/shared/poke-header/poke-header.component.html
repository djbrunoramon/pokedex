<header class="header">
  <a routerLink="/" class="brand">
    <img src="assets/icons/pokedex.svg" alt="" width="28" height="28">
    Pokédex
  </a>

  <nav class="nav" aria-label="Principal">
    <a routerLink="/comparar" routerLinkActive="active" ariaCurrentWhenActive="page" class="btn btn__ghost btn__small">
      <span aria-hidden="true">⇄</span> Comparar
    </a>
    <a routerLink="/favoritos" routerLinkActive="active" ariaCurrentWhenActive="page" class="btn btn__ghost btn__small">
      <span aria-hidden="true">♥</span> Favoritos
      @if (favorites.count()) {
        <span class="badge">{{ favorites.count() }}</span>
      }
    </a>
    <button type="button" class="btn btn__ghost btn__small keys" aria-label="Atalhos de teclado" aria-keyshortcuts="?"
            title="Atalhos de teclado (?)" (click)="shortcuts.open()">
      <span aria-hidden="true">?</span>
    </button>
    <button type="button" class="btn btn__ghost btn__small" aria-label="Tema claro"
            [attr.aria-pressed]="theme.theme() === 'light'" title="Alternar entre tema claro e escuro"
            (click)="theme.toggle()">
      <span aria-hidden="true">{{ theme.theme() === 'light' ? '☾' : '☀' }}</span>
    </button>
  </nav>
</header>

<poke-shortcuts #shortcuts></poke-shortcuts>

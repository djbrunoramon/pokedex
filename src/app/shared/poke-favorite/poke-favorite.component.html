<button
  type="button"
  class="favorite"
  [attr.aria-pressed]="active()"
  [attr.aria-label]="'Favoritar ' + name()"
  [title]="active() ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
  (click)="toggle()"
>
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path
      d="M12 20.4 10.6 19C5.6 14.5 2.5 11.7 2.5 8.3 2.5 5.6 4.6 3.5 7.3 3.5c1.5 0 3 .7 4 1.9 1-1.2 2.5-1.9 4-1.9 2.7 0 4.8 2.1 4.8 4.8 0 3.4-3.1 6.2-8.1 10.7L12 20.4Z"
    />
  </svg>
</button>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Pokédex</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pokédex: explore os 1025 Pokémon da Pokédex nacional: tipos, estatísticas e evoluções, com dados da PokéAPI.">
  <meta name="theme-color" content="#262835">
  <script>
    // Tema antes da primeira pintura (sem piscar): a escolha salva, senão a do sistema. Ver ThemeService.
    try {
      var tema = localStorage.getItem('pokedex:tema');
      if (tema !== 'light' && tema !== 'dark') tema = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', tema);
    } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="assets/icons/pokedex.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
